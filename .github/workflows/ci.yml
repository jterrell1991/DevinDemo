name: CI

on:
  push:
    branches: [ "7.0.16" ]
  pull_request:
    branches: [ "7.0.16" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build project
        run: mvn compile test-compile -pl kafka-rest -am -q

      - name: Run ProduceAction integration tests
        run: mvn test -pl kafka-rest -Dtest="ProduceActionIntegrationTest" -DfailIfNoTests=false -Dsurefire.rerunFailingTestsCount=2
        timeout-minutes: 20
