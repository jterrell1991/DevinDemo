name: Integration Tests

on:
  push:
    branches: [ '7.0.16', 'main', 'master' ]
  pull_request:
    branches: [ '7.0.16', 'main', 'master' ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build project
        run: mvn compile test-compile -pl kafka-rest -q

      - name: Run integration tests
        run: mvn test -pl kafka-rest -Dtest=ProduceActionExtendedIntegrationTest -DfailIfNoTests=false -Dsurefire.timeout=300
